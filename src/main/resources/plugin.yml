name: SimpleSpawn
main: com.broja.simplespawn.SimpleSpawn
version: 1.0.0
api-version: "1.20"
authors: ["broja"]

commands:
  setspawn:
    description: Set the server spawn to your current location
    usage: /<command>
    permission: simplespawn.set
  spawn:
    description: Teleport to the configured spawn
    usage: /<command>

permissions:
  simplespawn.set:
    description: Allows setting the spawn location
    default: op
